name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Required for npm Trusted Publisher (OIDC); pnpm publishes via id-token
    # when this is set, otherwise it tries to use `.npmrc` _authToken and
    # fails with ERR_PNPM_ID_TOKEN_GITHUB_WORKFLOW_INCORRECT_PERMISSIONS.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6
        # `packageManager` in package.json (pnpm@12.8.1) is read automatically;
        # do NOT set `version` here — pinning it conflicts with the manifest.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + test + build)
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish packages
        run: pnpm -r publish --access public --no-git-checks
